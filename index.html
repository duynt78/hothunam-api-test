
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hothunam API Tester</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;background:#f5f7fb;color:#172033}
main{background:white;padding:20px;border-radius:16px}
input,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;margin:6px 0;border-radius:9px}
input{border:1px solid #bbb}button{border:0;background:#174ea6;color:white;font-weight:600}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101827;color:#d6f5df;padding:12px;border-radius:10px;min-height:60px}
small{color:#555}.endpoint{margin-top:10px;border-top:1px solid #ddd;padding-top:10px}
</style>
</head>
<body>
<main>
<h1>Hothunam API Tester</h1>
<p>Kiểm tra backend và các API chỉ đọc. Không nhập token vào máy dùng chung.</p>
<label for="token">ADMIN_TOKEN (không chia sẻ token)</label>
<input id="token" type="password" autocomplete="off" placeholder="Nhập token bí mật của bạn">
<button onclick="checkHealth()">1. Kiểm tra /health</button>
<button onclick="checkUnauthorized()">2. Kiểm tra API không có token</button>
<button onclick="checkApi()">3. Kiểm tra API có token</button>
<div class="endpoint">
<h3>Kết quả</h3>
<pre id="output">Chưa kiểm tra.</pre>
</div>
<small>Trang không lưu token vào localStorage hoặc cookie. Khi đóng hoặc tải lại trang, hãy nhập lại token nếu cần.</small>
</main>
<script>
const base="https://hothunam-automation.kevinnguyen7923.workers.dev";
const out=document.getElementById("output");
function show(x){out.textContent=typeof x==="string"?x:JSON.stringify(x,null,2)}
async function request(path,token){
 try{
  const headers={};
  if(token) headers.Authorization="Bearer "+token;
  const r=await fetch(base+path,{headers,cache:"no-store"});
  const t=await r.text();
  show("URL: "+path+"\nHTTP: "+r.status+"\n\n"+t);
 }catch(e){
  show("Không gọi được API.\n"+String(e)+"\n\nCó thể do CORS, kết nối mạng hoặc lỗi Worker.");
 }
}
function checkHealth(){request("/health","")}
function checkUnauthorized(){request("/api/summary","")}
function checkApi(){
 const t=document.getElementById("token").value.trim();
 if(!t){show("Hãy nhập ADMIN_TOKEN vào ô mật khẩu trước.");return}
 request("/api/summary",t)
}
</script>
</body>
</html>
